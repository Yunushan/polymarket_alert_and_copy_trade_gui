name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - macos-15
          - macos-26
          - windows-2025-vs2026
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Tkinter fallback smoke test
        run: python app.py --smoke-test

      - name: Project verification
        run: python verify.py

  future-python:
    name: Future Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - macos-15
          - macos-26
          - windows-2025-vs2026
        python-version:
          - "3.x"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up future Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Tkinter fallback smoke test
        run: python app.py --smoke-test

      - name: Project verification
        run: python verify.py

  tkinter-gui-lifecycle:
    name: Tkinter GUI lifecycle / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Construct and close the real Tkinter GUI
        env:
          PREDICTION_MARKET_CONFIG_PATH: ${{ runner.temp }}/market-sentinel-gui-smoke.json
        run: xvfb-run --auto-servernum python app.py --gui-smoke-test

  enterprise-linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RHEL 8 UBI / Python 3.12
            image: registry.access.redhat.com/ubi8/python-312:latest
            python: python3.12
            bootstrap: dnf -y install python3.12-tkinter git
            desktop_validation: "true"
          - name: RHEL 9 UBI / Python 3.12
            image: registry.access.redhat.com/ubi9/python-312:latest
            python: python3.12
            bootstrap: dnf -y install python3.12-tkinter git
            desktop_validation: "true"
          - name: RHEL 10 UBI / Python 3.12 minimal
            image: registry.access.redhat.com/ubi10/python-312-minimal:latest
            python: python3.12
            bootstrap: microdnf install -y python3.12-tkinter git
            desktop_validation: "true"
          - name: RHEL 7 ABI / manylinux2014 Python 3.10
            image: quay.io/pypa/manylinux2014_x86_64:latest
            python: /opt/python/cp310-cp310/bin/python
            bootstrap: ""
            desktop_validation: "false"
          - name: Rocky Linux 8 / Python 3.12
            image: rockylinux/rockylinux:8
            python: python3.12
            bootstrap: dnf -y upgrade --refresh && dnf -y install python3.12 python3.12-pip python3.12-tkinter git
            desktop_validation: "true"
          - name: Rocky Linux 9 / Python 3.12
            image: rockylinux/rockylinux:9
            python: python3.12
            bootstrap: dnf -y upgrade --refresh && dnf -y install python3.12 python3.12-pip python3.12-tkinter git
            desktop_validation: "true"
          - name: Rocky Linux 10 / Python 3.12
            image: rockylinux/rockylinux:10
            python: python3.12
            bootstrap: dnf -y upgrade --refresh && dnf -y install --allowerasing --nobest python3.12 python3.12-pip python3.12-tkinter git
            desktop_validation: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify in Enterprise Linux container
        shell: bash
        env:
          BOOTSTRAP_COMMAND: ${{ matrix.bootstrap }}
          CONTAINER_IMAGE: ${{ matrix.image }}
          CONTAINER_NAME: ${{ matrix.name }}
          PYTHON_COMMAND: ${{ matrix.python }}
          DESKTOP_VALIDATION: ${{ matrix.desktop_validation }}
        run: |
          DOCKER_DISPLAY_ARGS=()
          if [ "$DESKTOP_VALIDATION" = "true" ]; then
            if ! command -v Xvfb >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes xvfb
            fi
            Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp >/tmp/marketsentinel-xvfb.log 2>&1 &
            XVFB_PID=$!
            cleanup_xvfb() {
              kill "$XVFB_PID" 2>/dev/null || true
            }
            trap cleanup_xvfb EXIT
            sleep 1
            if ! kill -0 "$XVFB_PID" 2>/dev/null; then
              cat /tmp/marketsentinel-xvfb.log
              echo "Xvfb failed to start for desktop validation."
              exit 1
            fi
            DOCKER_DISPLAY_ARGS=(
              -e DISPLAY=:99
              -v /tmp/.X11-unix:/tmp/.X11-unix
            )
          fi
          docker run --rm \
            --user 0 \
            -e CI_BOOTSTRAP_COMMAND="$BOOTSTRAP_COMMAND" \
            -e CI_CONTAINER_NAME="$CONTAINER_NAME" \
            -e CI_PYTHON_COMMAND="$PYTHON_COMMAND" \
            -e CI_DESKTOP_VALIDATION="$DESKTOP_VALIDATION" \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PIP_NO_CACHE_DIR=1 \
            "${DOCKER_DISPLAY_ARGS[@]}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$CONTAINER_IMAGE" \
            sh -lc '
              set -eu
              if [ -n "${CI_BOOTSTRAP_COMMAND:-}" ]; then
                sh -lc "$CI_BOOTSTRAP_COMMAND"
              fi
              if command -v git >/dev/null 2>&1; then
                git config --global --add safe.directory /workspace
              fi

              PYTHON="${CI_PYTHON_COMMAND:-python3}"
              if [ -x "$PYTHON" ]; then
                PYTHON_BIN="$PYTHON"
              elif command -v "$PYTHON" >/dev/null 2>&1; then
                PYTHON_BIN="$PYTHON"
              elif command -v python3.12 >/dev/null 2>&1; then
                PYTHON_BIN=python3.12
              elif command -v python3 >/dev/null 2>&1; then
                PYTHON_BIN=python3
              else
                PYTHON_BIN=python
              fi

              "$PYTHON_BIN" --version
              if "$PYTHON_BIN" -m venv /tmp/marketsentinel-enterprise-venv; then
                . /tmp/marketsentinel-enterprise-venv/bin/activate
                PYTHON_BIN=python
              fi
              "$PYTHON_BIN" -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
              "$PYTHON_BIN" -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
              "$PYTHON_BIN" -m pip install --no-cache-dir --no-deps .
              "$PYTHON_BIN" scripts/ci_enterprise_linux_smoke.py --label "$CI_CONTAINER_NAME"
              if [ "${CI_DESKTOP_VALIDATION:-false}" = "true" ]; then
                if [ -z "${DISPLAY:-}" ]; then
                  echo "DISPLAY is required for desktop validation but is not configured."
                  exit 1
                fi
                "$PYTHON_BIN" app.py --gui-smoke-test
                "$PYTHON_BIN" app.py --smoke-test
                "$PYTHON_BIN" verify.py
              else
                echo "[info] Desktop smoke and full verification intentionally skipped for ABI-only container."
              fi
            '

  windows-11:
    name: Windows 11 ARM runner / Python 3.12 x64
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Tkinter fallback smoke test
        run: python app.py --smoke-test

      - name: Project verification
        run: python verify.py

  windows-10-self-hosted:
    name: Windows 10 self-hosted / Python 3.12
    if: ${{ vars.ENABLE_WINDOWS_10_SELF_HOSTED == 'true' }}
    runs-on:
      - self-hosted
      - windows
      - x64
      - windows-10
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Tkinter fallback smoke test
        run: python app.py --smoke-test

      - name: Project verification
        run: python verify.py

  frontend:
    name: React build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build React frontend
        run: npm run build

      - name: Set up Python for browser workflows
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install isolated browser backend dependencies
        working-directory: .
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock

      - name: Install browser acceptance runtime
        run: npx playwright install --with-deps chromium

      - name: Verify browser workflows
        working-directory: .
        run: python scripts/verify_browser_workflows.py

      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-workflow-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload built frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  mobile-web:
    name: Mobile web smoke / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - frontend
    strategy:
      fail-fast: false
      matrix:
        target:
          - android-14
          - android-15
          - android-16
          - ios-15
          - ios-16
          - ios-18
          - ios-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download built frontend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Mobile web smoke
        run: python scripts/verify_mobile_web_smoke.py --target "${{ matrix.target }}"

  public-polymarket-live:
    name: Public Polymarket live / GitHub-hosted
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify exact clean source before probe
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install hash-locked runtime
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements.lock

      - name: Probe reviewed public Polymarket endpoints
        shell: bash
        run: |
          report_dir="${RUNNER_TEMP}/public-live"
          report_file="${report_dir}/public-polymarket-live.json"
          mkdir -p "${report_dir}"
          probe_succeeded=false
          for probe_attempt in 1 2; do
            candidate="${report_dir}/attempt-${probe_attempt}.json"
            if python -B scripts/verify_polymarket_live.py \
              --public-only \
              --timeout 15 \
              --report-file "${candidate}" \
              --source-repository "${GITHUB_REPOSITORY}" \
              --source-revision "${GITHUB_SHA}" \
              --source-run-id "${GITHUB_RUN_ID}" \
              --source-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --source-workflow-ref "${GITHUB_WORKFLOW_REF}"; then
              mv -- "${candidate}" "${report_file}"
              probe_succeeded=true
              break
            fi
            if [ "${probe_attempt}" -eq 1 ]; then
              sleep 1
            elif [ -f "${candidate}" ]; then
              mv -- "${candidate}" "${report_file}"
            else
              printf '%s\n' '{"ok":false,"mode":"public_only","error":"probe terminated before a report was written"}' > "${report_file}"
            fi
          done
          if [ "${probe_succeeded}" != true ]; then
            exit 1
          fi

      - name: Revalidate public-only evidence before attestation
        shell: bash
        run: |
          python -B scripts/verify_polymarket_live.py \
            --validate-public-only-report '${{ runner.temp }}/public-live/public-polymarket-live.json' \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-revision "${GITHUB_SHA}" \
            --source-run-id "${GITHUB_RUN_ID}" \
            --source-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-workflow-ref "${GITHUB_WORKFLOW_REF}"

      - name: Reverify exact clean source after probe
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Attest exact public-live evidence file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/public-live/public-polymarket-live.json

      - name: Upload public-live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-polymarket-live-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-live/public-polymarket-live.json
          if-no-files-found: error
          retention-days: 14

  package:
    name: Python package build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ always() }}
    needs:
      - python
      - future-python
      - enterprise-linux
      - windows-11
      - windows-10-self-hosted
      - frontend
      - mobile-web
      - tkinter-gui-lifecycle
    steps:
      - name: Enforce required CI jobs
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          FUTURE_PYTHON_RESULT: ${{ needs.future-python.result }}
          ENTERPRISE_LINUX_RESULT: ${{ needs.enterprise-linux.result }}
          WINDOWS_11_RESULT: ${{ needs.windows-11.result }}
          WINDOWS_10_RESULT: ${{ needs.windows-10-self-hosted.result }}
          WINDOWS_10_ENABLED: ${{ vars.ENABLE_WINDOWS_10_SELF_HOSTED }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MOBILE_WEB_RESULT: ${{ needs.mobile-web.result }}
          TKINTER_GUI_RESULT: ${{ needs.tkinter-gui-lifecycle.result }}
        shell: bash
        run: |
          failed=0
          for entry in \
            "python:${PYTHON_RESULT}" \
            "future-python:${FUTURE_PYTHON_RESULT}" \
            "enterprise-linux:${ENTERPRISE_LINUX_RESULT}" \
            "windows-11:${WINDOWS_11_RESULT}" \
            "frontend:${FRONTEND_RESULT}" \
            "mobile-web:${MOBILE_WEB_RESULT}" \
            "tkinter-gui-lifecycle:${TKINTER_GUI_RESULT}"; do
            job="${entry%%:*}"
            result="${entry#*:}"
            if [ "${result}" != "success" ]; then
              echo "Required CI job ${job} finished with ${result}."
              failed=1
            fi
          done
          if [ "${WINDOWS_10_ENABLED}" = "true" ] && [ "${WINDOWS_10_RESULT}" != "success" ]; then
            echo "Required opt-in CI job windows-10-self-hosted finished with ${WINDOWS_10_RESULT}."
            failed=1
          fi
          exit "${failed}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build Python distribution
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-build.lock
          python -m build --no-isolation

      - name: Smoke install built wheel
        shell: bash
        run: |
          expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected_market_count="$(python -c 'from market_adapters import MARKET_IDS; print(len(MARKET_IDS))')"
          python scripts/verify_python_dist_artifacts.py --dist-dir dist --expected-version "${expected_version}"
          python -m pip install --no-cache-dir --force-reinstall --no-deps "dist/market_sentinel-${expected_version}-py3-none-any.whl"
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          market-sentinel --help >/dev/null
          EXPECTED_VERSION="${expected_version}" EXPECTED_MARKET_COUNT="${expected_market_count}" python - <<'PY'
          import os
          from importlib.metadata import metadata, version
          from market_adapters import CryptoComPredictAdapter, build_default_registry

          assert version("market-sentinel") == os.environ["EXPECTED_VERSION"]
          package_metadata = metadata("market-sentinel")
          assert package_metadata["License-Expression"] == "0BSD"
          assert package_metadata.get_all("License-File") == ["LICENSE"]
          assert len(build_default_registry().list_market_ids()) == int(os.environ["EXPECTED_MARKET_COUNT"])
          assert CryptoComPredictAdapter().market_id == "crypto_com_predict"
          PY

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
