name: Production deployment evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable release tag already deployed, for example v1.0.11
        required: true
        type: string
      production_origin:
        description: Exact authenticated public HTTPS origin, without a path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment-evidence
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare trusted deployment identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    outputs:
      version: ${{ steps.coordinates.outputs.version }}
      tag: ${{ steps.coordinates.outputs.tag }}
      frontend_sha256: ${{ steps.identity.outputs.frontend_sha256 }}
      production_origin: ${{ steps.origin.outputs.production_origin }}
    steps:
      - name: Require exact protected production origin
        id: origin
        shell: bash
        env:
          REQUESTED_ORIGIN: ${{ inputs.production_origin }}
          APPROVED_ORIGIN: ${{ vars.MARKET_SENTINEL_PRODUCTION_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "${APPROVED_ORIGIN}"
          test "${REQUESTED_ORIGIN}" = "${APPROVED_ORIGIN}"
          python -c 'import ipaddress,socket,sys; from urllib.parse import urlparse; p=urlparse(sys.argv[1]); assert p.scheme == "https" and p.hostname and p.path in ("", "/") and not (p.username or p.password or p.query or p.fragment); addresses={ipaddress.ip_address(item[4][0]) for item in socket.getaddrinfo(p.hostname, p.port or 443, type=socket.SOCK_STREAM)}; assert addresses and all(address.is_global for address in addresses)' "${APPROVED_ORIGIN}"
          echo "production_origin=${APPROVED_ORIGIN}" >> "${GITHUB_OUTPUT}"

      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Resolve exact release coordinates
        id: coordinates
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag on protected main
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.coordinates.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin main
          python scripts/verify_release_provenance.py \
            --tag "${RELEASE_TAG}" \
            --commit "${GITHUB_SHA}" \
            --main-ref origin/main

      - name: Download exact published release frontend asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.coordinates.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/deployment-identity"
          asset="market-sentinel-${RELEASE_TAG}-frontend-dist.zip"
          gh api --method GET "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/deployment-identity/release.json"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset}" --dir "${RUNNER_TEMP}/deployment-identity"

      - name: Derive frontend digest from exact release asset
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.coordinates.outputs.tag }}
          RELEASE_VERSION: ${{ steps.coordinates.outputs.version }}
        run: |
          set -euo pipefail
          asset="${RUNNER_TEMP}/deployment-identity/market-sentinel-${RELEASE_TAG}-frontend-dist.zip"
          output="${RUNNER_TEMP}/deployment-identity/release-identity.json"
          python scripts/generate_deployment_evidence.py identity \
            --release-json "${RUNNER_TEMP}/deployment-identity/release.json" \
            --frontend-asset "${asset}" \
            --tag "${RELEASE_TAG}" \
            --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" \
            --output "${output}"
          digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["frontend_sha256"])' "${output}")"
          echo "frontend_sha256=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload trusted deployment identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-release-identity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-identity/release-identity.json
          if-no-files-found: error
          retention-days: 2

  collect:
    name: Collect production deployment evidence
    needs: prepare
    runs-on: [self-hosted, linux, x64, market-sentinel-production]
    environment:
      name: production
      url: ${{ needs.prepare.outputs.production_origin }}
    timeout-minutes: 15
    steps:
      - name: Checkout evidence tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download trusted deployment identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deployment-release-identity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-identity

      - name: Collect raw production deployment evidence
        shell: bash
        env:
          MARKET_SENTINEL_API_TOKEN: ${{ secrets.MARKET_SENTINEL_API_TOKEN }}
          MARKET_SENTINEL_PUBLIC_BASIC_USER: ${{ secrets.MARKET_SENTINEL_PUBLIC_BASIC_USER }}
          MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD: ${{ secrets.MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD }}
          PRODUCTION_ORIGIN: ${{ needs.prepare.outputs.production_origin }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_SHA256: ${{ needs.prepare.outputs.frontend_sha256 }}
          DEPLOYMENT_PROVIDER: ${{ vars.MARKET_SENTINEL_DEPLOYMENT_PROVIDER }}
          EXPECTED_HOST_ID_SHA256: ${{ vars.MARKET_SENTINEL_PRODUCTION_HOST_ID_SHA256 }}
        run: |
          set -euo pipefail
          test -n "${MARKET_SENTINEL_API_TOKEN}"
          test -n "${MARKET_SENTINEL_PUBLIC_BASIC_USER}"
          test -n "${MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD}"
          test -n "${DEPLOYMENT_PROVIDER}"
          test -n "${EXPECTED_HOST_ID_SHA256}"
          evidence_dir="/var/lib/market-sentinel-deployment-evidence"
          evidence_file="${evidence_dir}/deployment-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          sudo install -d -o root -g root -m 0700 "${evidence_dir}"
          sudo --preserve-env=MARKET_SENTINEL_API_TOKEN,MARKET_SENTINEL_PUBLIC_BASIC_USER,MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD \
            /usr/bin/python3 \
            "${GITHUB_WORKSPACE}/scripts/verify_production_deployment.py" \
            --deployment-root /opt/market-sentinel \
            --expected-version "${RELEASE_VERSION}" \
            --expected-source-revision "${GITHUB_SHA}" \
            --expected-frontend-sha256 "${FRONTEND_SHA256}" \
            --frontend-dir /opt/market-sentinel/frontend/dist \
            --backup-directory /var/lib/market-sentinel-backups \
            --deployment-provider "${DEPLOYMENT_PROVIDER}" \
            --expected-host-id-sha256 "${EXPECTED_HOST_ID_SHA256}" \
            --host-identity-file /etc/machine-id \
            --rollback-drill-report /var/lib/market-sentinel-rollback-drills/latest.json \
            --public-url "${PRODUCTION_ORIGIN}" \
            --evidence-run-id "${GITHUB_RUN_ID}" \
            --evidence-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --evidence-nonce "${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --output "${evidence_file}"
          sudo install -m 0644 "${evidence_file}" "${RUNNER_TEMP}/raw-deployment.json"

      - name: Upload raw production deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: raw-deployment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/raw-deployment.json
          if-no-files-found: error
          retention-days: 2

  external-probe:
    name: Probe production externally from GitHub-hosted runner
    needs: prepare
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ needs.prepare.outputs.production_origin }}
    timeout-minutes: 10
    steps:
      - name: Checkout trusted public probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up public probe Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Probe exact public deployment from GitHub-hosted runner
        shell: bash
        env:
          MARKET_SENTINEL_PUBLIC_BASIC_USER: ${{ secrets.MARKET_SENTINEL_PUBLIC_BASIC_USER }}
          MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD: ${{ secrets.MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD }}
          PRODUCTION_ORIGIN: ${{ needs.prepare.outputs.production_origin }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          FRONTEND_SHA256: ${{ needs.prepare.outputs.frontend_sha256 }}
        run: |
          set -euo pipefail
          test -n "${MARKET_SENTINEL_PUBLIC_BASIC_USER}"
          test -n "${MARKET_SENTINEL_PUBLIC_BASIC_PASSWORD}"
          mkdir -p "${RUNNER_TEMP}/external-deployment-probe"
          python scripts/verify_production_deployment.py \
            --external-public-probe-only \
            --expected-version "${RELEASE_VERSION}" \
            --expected-source-revision "${GITHUB_SHA}" \
            --expected-frontend-sha256 "${FRONTEND_SHA256}" \
            --public-url "${PRODUCTION_ORIGIN}" \
            --public-basic-user "${MARKET_SENTINEL_PUBLIC_BASIC_USER}" \
            --evidence-run-id "${GITHUB_RUN_ID}" \
            --evidence-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --evidence-nonce "${GITHUB_SHA}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --output "${RUNNER_TEMP}/external-deployment-probe/external-probe.json"

      - name: Upload raw GitHub-hosted external probe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: external-deployment-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/external-deployment-probe/external-probe.json
          if-no-files-found: error
          retention-days: 2

  review:
    name: Review and attest production deployment evidence
    needs: [prepare, collect, external-probe]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up reviewer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download trusted deployment identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: deployment-release-identity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-review

      - name: Download raw production deployment evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: raw-deployment-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-review

      - name: Download raw GitHub-hosted external probe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: external-deployment-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-review

      - name: Review raw report and bind exact release identity
        shell: bash
        env:
          PRODUCTION_ORIGIN: ${{ needs.prepare.outputs.production_origin }}
        run: |
          set -euo pipefail
          artifact="deployment-evidence-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${RUNNER_TEMP}/deployment-attestation"
          python scripts/generate_deployment_evidence.py evidence \
            --raw-report "${RUNNER_TEMP}/deployment-review/raw-deployment.json" \
            --external-probe-report "${RUNNER_TEMP}/deployment-review/external-probe.json" \
            --identity "${RUNNER_TEMP}/deployment-review/release-identity.json" \
            --public-origin "${PRODUCTION_ORIGIN}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --source-ref "${GITHUB_REF}" \
            --artifact-name "${artifact}" \
            --output "${RUNNER_TEMP}/deployment-attestation/deployment-evidence.json"

      - name: Attest exact deployment evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/deployment-attestation/deployment-evidence.json

      - name: Upload attested deployment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-attestation/deployment-evidence.json
          if-no-files-found: error
          retention-days: 2
