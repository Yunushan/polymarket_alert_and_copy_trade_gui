name: Release
run-name: Release ${{ inputs.tag_name || github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Share this immutable lock with release-evidence-reconcile.yml so a stale
  # reconciler can never draft a newer publication while it is being produced.
  group: release-${{ github.sha }}
  cancel-in-progress: false

env:
  APP_NAME: market-sentinel
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      draft: ${{ steps.release.outputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release inputs
        id: release
        env:
          DISPATCH_TAG_NAME: ${{ inputs.tag_name }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
          DISPATCH_DRAFT: ${{ inputs.draft }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_name="${DISPATCH_TAG_NAME}"
            requested_prerelease="${DISPATCH_PRERELEASE}"
            draft="${DISPATCH_DRAFT}"
          else
            tag_name="${GITHUB_REF_NAME}"
            draft="false"
          fi

          version="$(python scripts/release_version.py normalize-tag "${tag_name}")"
          prerelease="$(python scripts/release_version.py is-prerelease "${tag_name}")"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${requested_prerelease}" != "${prerelease}" ]; then
            echo "The prerelease input (${requested_prerelease}) conflicts with tag ${tag_name} (${prerelease})." >&2
            echo "Prerelease state is derived from the validated release tag; correct the input and retry." >&2
            exit 1
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"

      - name: Validate package version matches release tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        shell: bash
        run: |
          python scripts/release_version.py validate-project \
            --tag "${RELEASE_TAG}" \
            --pyproject pyproject.toml

      - name: Require release tag to resolve to workflow commit on protected main
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)" fetch --force --tags origin main
          python scripts/verify_release_provenance.py \
            --tag "${RELEASE_TAG}" \
            --commit "${GITHUB_SHA}" \
            --main-ref "origin/main"

  python-compatibility:
    name: Python compatibility ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - macos-15
          - macos-26
          - windows-2025-vs2026
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.x"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .

      - name: Verify Python and Tkinter fallback
        run: |
          python app.py --smoke-test
          python verify.py

  python-dist:
    name: Verify and build Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-test.lock
          python -m pip install --no-cache-dir --no-deps -e .
          python -m pip install --no-cache-dir --require-hashes -r requirements-build.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-security.lock

      - name: Audit locked Python dependencies used for packaging
        run: |
          python -m pip_audit --requirement requirements-bootstrap.lock --progress-spinner off
          python -m pip_audit --requirement requirements.lock --progress-spinner off
          python -m pip_audit --requirement requirements-live.lock --progress-spinner off
          python -m pip_audit --requirement requirements-test.lock --progress-spinner off
          python -m pip_audit --requirement requirements-build.lock --progress-spinner off
          python -m pip_audit --requirement requirements-security.lock --progress-spinner off

      - name: Verify Python and Tkinter fallback
        run: |
          python app.py --smoke-test
          python verify.py

      - name: Verify real Tkinter GUI lifecycle
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          xvfb-run --auto-servernum python app.py --gui-smoke-test
        env:
          PREDICTION_MARKET_CONFIG_PATH: ${{ runner.temp }}/market-sentinel-gui-smoke.json

      - name: Build Python distributions
        run: python -m build --no-isolation

      - name: Smoke install built wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          expected_market_count="$(python -c 'from market_adapters import MARKET_IDS; print(len(MARKET_IDS))')"
          python scripts/verify_python_dist_artifacts.py --dist-dir dist --expected-version "${EXPECTED_VERSION}"
          python -m pip install --no-cache-dir --force-reinstall --no-deps "dist/market_sentinel-${EXPECTED_VERSION}-py3-none-any.whl"
          smoke_dir="$(mktemp -d)"
          cd "${smoke_dir}"
          market-sentinel --help >/dev/null
          EXPECTED_MARKET_COUNT="${expected_market_count}" python - <<'PY'
          import os
          from importlib.metadata import metadata, version
          from market_adapters import CryptoComPredictAdapter, build_default_registry

          assert version("market-sentinel") == os.environ["EXPECTED_VERSION"]
          package_metadata = metadata("market-sentinel")
          assert package_metadata["License-Expression"] == "0BSD"
          assert package_metadata.get_all("License-File") == ["LICENSE"]
          assert len(build_default_registry().list_market_ids()) == int(os.environ["EXPECTED_MARKET_COUNT"])
          assert CryptoComPredictAdapter().market_id == "crypto_com_predict"
          PY

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  frontend-dist:
    name: Build React production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: metadata
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Audit frontend dependencies used for packaging
        run: npm audit --audit-level=high

      - name: Build React frontend
        run: npm run build

      - name: Create frontend zip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path("dist")
          out = Path("../release-frontend-dist.zip")
          with ZipFile(out, "w", ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          PY

      - name: Upload frontend distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-dist-zip
          path: release-frontend-dist.zip
          if-no-files-found: error
          retention-days: 14

  windows-app:
    name: Build Windows EXE and MSI
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    environment: release
    env:
      # Keep signed releases fail-closed when explicitly required, while
      # allowing an explicitly unsigned ZIP/MSI for development or testing.
      WINDOWS_SIGNING_REQUIRED: ${{ vars.REQUIRE_WINDOWS_CODE_SIGNING == 'true' }}
    needs:
      - metadata
      - frontend-dist
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify Windows signing configuration
        env:
          WINDOWS_SIGNING_REQUIRED: ${{ vars.REQUIRE_WINDOWS_CODE_SIGNING == 'true' }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_CODE_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_CODE_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGNING_REQUIRED -ne "true") {
            Write-Warning "Windows code signing is disabled; this release will contain unsigned Windows artifacts."
            exit 0
          }

          $missing = [System.Collections.Generic.List[string]]::new()
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64)) {
            $missing.Add("release-environment secret WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64")
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD)) {
            $missing.Add("release-environment secret WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD")
          }

          if ($missing.Count -eq 0) {
            try {
              $encodedCertificate = $env:WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64.Trim()
              if ($encodedCertificate -match "\s") {
                throw "certificate base64 contains internal whitespace"
              }
              $certificateBytes = [Convert]::FromBase64String($encodedCertificate)
              $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
                $certificateBytes,
                $env:WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD,
                [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
              )
              if (-not $certificate.HasPrivateKey) {
                $missing.Add("a PFX certificate with a private key")
              }
              $certificate.Dispose()
            } catch {
              $missing.Add("a valid password-protected PFX in WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64")
            }
          }

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODE_SIGNING_TIMESTAMP_URL)) {
            "https://timestamp.digicert.com"
          } else {
            $env:WINDOWS_CODE_SIGNING_TIMESTAMP_URL
          }
          try {
            $timestampUri = [System.Uri]$timestampUrl
            if (-not $timestampUri.IsAbsoluteUri -or $timestampUri.Scheme -cne "https") {
              throw "timestamp URL must use HTTPS"
            }
          } catch {
            $missing.Add("an HTTPS WINDOWS_CODE_SIGNING_TIMESTAMP_URL")
          }

          if ($missing.Count -gt 0) {
            throw "Protected release signing preflight failed. Configure: " + ($missing -join "; ")
          }

      - name: Download frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist-zip
          path: release-inputs

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir --require-hashes -r requirements-bootstrap.lock
          python -m pip install --no-cache-dir --require-hashes -r requirements-live.lock
          python -m pip install --no-cache-dir --no-deps -e .
          python -m pip install --no-cache-dir --require-hashes -r requirements-build.lock

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          $env:PATH = "$toolPath;$env:PATH"
          $installedTools = dotnet tool list --global
          if ($installedTools -match '^\s*wix\s+') {
            dotnet tool uninstall --global wix
          }
          dotnet tool install --global wix --version 6.0.2
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wixVersion = wix --version
          if (-not ($wixVersion -like "6.0.2*")) {
            throw "Expected WiX Toolset 6.0.2, got $wixVersion"
          }
          $wixVersion

      - name: Prepare Windows application payload
        shell: pwsh
        run: |
          python scripts/build_windows_release.py `
            --version "${{ needs.metadata.outputs.version }}" `
            --tag "${{ needs.metadata.outputs.tag_name }}" `
            --frontend-zip "release-inputs/release-frontend-dist.zip" `
            --output-dir "release-assets" `
            --prepare-only

      - name: Smoke test staged Windows executable
        shell: pwsh
        run: |
          $executable = "build/windows-release/market-sentinel-${{ needs.metadata.outputs.tag_name }}-win-x64/market-sentinel.exe"
          & $executable --smoke-test

      - name: Sign staged Windows executable
        if: ${{ env.WINDOWS_SIGNING_REQUIRED == 'true' }}
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_CODE_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_CODE_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $executable = "build/windows-release/market-sentinel-${{ needs.metadata.outputs.tag_name }}-win-x64/market-sentinel.exe"
          python scripts/sign_windows_release.py --path $executable

      - name: Package Windows portable zip and MSI
        shell: pwsh
        run: |
          python scripts/build_windows_release.py `
            --version "${{ needs.metadata.outputs.version }}" `
            --tag "${{ needs.metadata.outputs.tag_name }}" `
            --output-dir "release-assets" `
            --package-only

      - name: Sign Windows MSI package
        if: ${{ env.WINDOWS_SIGNING_REQUIRED == 'true' }}
        env:
          WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_CODE_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_CODE_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $installer = "release-assets/market-sentinel-${{ needs.metadata.outputs.tag_name }}-win-x64.msi"
          python scripts/sign_windows_release.py --path $installer

      - name: Verify signatures in final Windows artifacts
        if: ${{ env.WINDOWS_SIGNING_REQUIRED == 'true' }}
        shell: pwsh
        run: |
          $tag = "${{ needs.metadata.outputs.tag_name }}"
          $installer = "release-assets/market-sentinel-$tag-win-x64.msi"
          $portable = "release-assets/market-sentinel-$tag-win-x64.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP "market-sentinel-portable-signature-check"
          Expand-Archive -LiteralPath $portable -DestinationPath $extractDirectory
          $embeddedExecutables = @(
            Get-ChildItem -LiteralPath $extractDirectory -Recurse -File -Filter "market-sentinel.exe"
          )
          if ($embeddedExecutables.Count -ne 1) {
            throw "Expected exactly one embedded market-sentinel.exe; found $($embeddedExecutables.Count)."
          }
          $signTool = (Get-Command signtool.exe -ErrorAction Stop).Source
          & $signTool verify /pa /all $embeddedExecutables[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "The executable embedded in the portable ZIP failed Authenticode verification."
          }
          & $signTool verify /pa /all $installer
          if ($LASTEXITCODE -ne 0) {
            throw "The final MSI failed Authenticode verification."
          }

      - name: Verify unsigned Windows artifacts
        if: ${{ env.WINDOWS_SIGNING_REQUIRED != 'true' }}
        shell: pwsh
        run: |
          $tag = "${{ needs.metadata.outputs.tag_name }}"
          $installer = "release-assets/market-sentinel-$tag-win-x64.msi"
          $portable = "release-assets/market-sentinel-$tag-win-x64.zip"
          foreach ($path in @($portable, $installer)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Unsigned Windows release artifact is missing: $path"
            }
          }
          $extractDirectory = Join-Path $env:RUNNER_TEMP "market-sentinel-portable-content-check"
          if (Test-Path -LiteralPath $extractDirectory) {
            Remove-Item -LiteralPath $extractDirectory -Recurse -Force
          }
          Expand-Archive -LiteralPath $portable -DestinationPath $extractDirectory
          $embeddedExecutables = @(
            Get-ChildItem -LiteralPath $extractDirectory -Recurse -File -Filter "market-sentinel.exe"
          )
          if ($embeddedExecutables.Count -ne 1) {
            throw "Expected exactly one embedded market-sentinel.exe; found $($embeddedExecutables.Count)."
          }
          Write-Warning "Windows EXE/MSI artifacts are intentionally unsigned; do not treat this release as production-trusted."

      - name: Upload Windows release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-dist
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - metadata
      - python-compatibility
      - python-dist
      - frontend-dist
      - windows-app
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for release metadata
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-dist
          path: release-assets

      - name: Download frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: frontend-dist-zip
          path: release-assets

      - name: Download Windows packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-dist
          path: release-assets

      - name: Normalize release asset names
        shell: bash
        run: |
          tag="${{ needs.metadata.outputs.tag_name }}"
          mv release-assets/release-frontend-dist.zip "release-assets/${APP_NAME}-${tag}-frontend-dist.zip"

      - name: Generate SPDX SBOM
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python scripts/generate_release_sbom.py \
            --version "${RELEASE_VERSION}" \
            --output "release-assets/${APP_NAME}-${RELEASE_VERSION}-sbom.spdx.json"

      - name: Generate checksums and release notes
        env:
          WINDOWS_SIGNING_REQUIRED: ${{ vars.REQUIRE_WINDOWS_CODE_SIGNING == 'true' }}
        shell: bash
        run: |
          tag="${{ needs.metadata.outputs.tag_name }}"
          version="${{ needs.metadata.outputs.version }}"
          if [ "${WINDOWS_SIGNING_REQUIRED}" = "true" ]; then
            windows_signing_note='- Windows EXE/MSI packages Authenticode-signed and verified'
          else
            windows_signing_note='- Windows EXE/MSI packages intentionally unsigned (testing/development distribution only)'
          fi
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
          cat > release-assets/RELEASE_NOTES.md <<EOF
          ## ${APP_NAME} ${tag}

          Automated release for \`${tag}\`.

          Verification performed in this workflow:
          - Python dependency installation and package import checks across Python 3.10 and newer, including the latest stable 3.x runner where available
          - Tkinter fallback smoke test
          - Full \`python verify.py\`
          - React production build
          - Python wheel/sdist build
          - Windows executable, portable zip, and MSI installer build
          ${windows_signing_note}
          - SHA256 checksum generation

          Assets:
          - Python wheel and source distribution
          - React production frontend zip
          - Windows x64 portable zip
          - Windows x64 MSI installer
          - SPDX JSON software bill of materials
          - \`SHA256SUMS.txt\`
          EOF

      - name: Verify final release assets
        shell: bash
        run: |
          python scripts/verify_release_assets.py \
            --asset-dir release-assets \
            --version "${{ needs.metadata.outputs.version }}" \
            --tag "${{ needs.metadata.outputs.tag_name }}"

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Reconcile and publish GitHub release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
          DRAFT: ${{ needs.metadata.outputs.draft }}
        shell: bash
        run: |
          remote_release_json="${RUNNER_TEMP}/market-sentinel-release.json"
          remote_assets_json="${RUNNER_TEMP}/market-sentinel-release-assets.json"
          stale_asset_ids="${RUNNER_TEMP}/market-sentinel-stale-release-asset-ids.txt"
          release_preflight_json="${RUNNER_TEMP}/market-sentinel-release-preflight.json"
          prepared_release_json="${RUNNER_TEMP}/market-sentinel-release-prepared.json"

          release_state_flags=(
            "--prerelease=${PRERELEASE}"
            "--draft=${DRAFT}"
          )

          prepared_release_id=""
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            > "${release_preflight_json}" 2>/dev/null; then
            if ! jq -e \
              --arg tag "${TAG_NAME}" \
              --arg target "${GITHUB_SHA}" \
              '.id | type == "number" and . > 0' \
              "${release_preflight_json}" >/dev/null || \
              ! jq -e \
                --arg tag "${TAG_NAME}" \
                --arg target "${GITHUB_SHA}" \
                '.tag_name == $tag and
                 .target_commitish == $target and
                 (.draft | type == "boolean") and
                 (.prerelease | type == "boolean")' \
                "${release_preflight_json}" >/dev/null; then
              echo "Existing release identity, target, or state is not canonical; refusing to mutate it." >&2
              exit 1
            fi
            prepared_release_id="$(jq -er '.id' "${release_preflight_json}")"
            current_draft="$(jq -er '.draft' "${release_preflight_json}")"
            current_prerelease="$(jq -er '.prerelease' "${release_preflight_json}")"
            if [[ "${current_draft}" != "true" &&
                  "${current_prerelease}" != "${PRERELEASE}" ]]; then
              echo "Existing published release prerelease state conflicts with ${TAG_NAME}; refusing to unpublish it." >&2
              exit 1
            fi
            # Never expose a mixture of assets from two workflow attempts.
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${prepared_release_id}" \
              -F draft=true > "${prepared_release_json}"
            if ! jq -e \
              --argjson release_id "${prepared_release_id}" \
              --arg tag "${TAG_NAME}" \
              --arg target "${GITHUB_SHA}" \
              '.id == $release_id and
               .tag_name == $tag and
               .target_commitish == $target and
               .draft == true and
               (.prerelease | type == "boolean")' \
              "${prepared_release_json}" >/dev/null; then
              echo "Existing release changed during draft transition; refusing asset mutation." >&2
              exit 1
            fi
          else
            gh release create "${TAG_NAME}" \
              --draft \
              --title "${TAG_NAME}" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --target "${GITHUB_SHA}"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              > "${prepared_release_json}"
            prepared_release_id="$(jq -er '.id | select(type == "number" and . > 0)' \
              "${prepared_release_json}")"
            if ! jq -e \
              --argjson release_id "${prepared_release_id}" \
              --arg tag "${TAG_NAME}" \
              --arg target "${GITHUB_SHA}" \
              '.id == $release_id and
               .tag_name == $tag and
               .target_commitish == $target and
               .draft == true and
               .prerelease == false' \
              "${prepared_release_json}" >/dev/null; then
              echo "New draft release identity or state is not canonical; refusing asset upload." >&2
              exit 1
            fi
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            > "${prepared_release_json}"
          if ! jq -e \
            --argjson release_id "${prepared_release_id}" \
            --arg tag "${TAG_NAME}" \
            --arg target "${GITHUB_SHA}" \
            '.id == $release_id and
             .tag_name == $tag and
             .target_commitish == $target and
             .draft == true and
             (.prerelease | type == "boolean")' \
            "${prepared_release_json}" >/dev/null; then
            echo "Release identity changed before asset upload; refusing mutation." >&2
            exit 1
          fi
          gh release upload "${TAG_NAME}" release-assets/* --clobber

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" > "${remote_release_json}"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' "${remote_release_json}")"
          if [ "${release_id}" != "${prepared_release_id}" ]; then
            echo "Release identity changed during asset upload." >&2
            exit 1
          fi
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq 'flatten' > "${remote_assets_json}"
          python scripts/verify_release_assets.py \
            --asset-dir release-assets \
            --version "${RELEASE_VERSION}" \
            --tag "${TAG_NAME}" \
            --remote-release-json "${remote_release_json}" \
            --remote-assets-json "${remote_assets_json}" \
            --print-stale-remote-asset-ids > "${stale_asset_ids}"

          while IFS= read -r asset_id; do
            if [[ ! "${asset_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Refusing invalid release asset id: ${asset_id}" >&2
              exit 1
            fi
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done < "${stale_asset_ids}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" > "${remote_release_json}"
          reconciled_release_id="$(jq -er '.id | select(type == "number" and . > 0)' "${remote_release_json}")"
          if [ "${reconciled_release_id}" != "${release_id}" ]; then
            echo "Release identity changed during asset reconciliation." >&2
            exit 1
          fi
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq 'flatten' > "${remote_assets_json}"
          python scripts/verify_release_assets.py \
            --asset-dir release-assets \
            --version "${RELEASE_VERSION}" \
            --tag "${TAG_NAME}" \
            --remote-release-json "${remote_release_json}" \
            --remote-assets-json "${remote_assets_json}" \
            --verify-remote-inventory

          downloaded_assets="$(mktemp -d "${RUNNER_TEMP}/market-sentinel-published-assets.XXXXXX")"
          gh release download "${TAG_NAME}" --dir "${downloaded_assets}"
          python scripts/verify_release_assets.py \
            --asset-dir "${downloaded_assets}" \
            --version "${RELEASE_VERSION}" \
            --tag "${TAG_NAME}"
          for local_asset in release-assets/*; do
            cmp -- "${local_asset}" "${downloaded_assets}/$(basename "${local_asset}")"
          done

          # Publish only after the remote inventory and downloaded bytes match locally.
          echo "release_prepared=true" >> "${GITHUB_OUTPUT}"
          gh release edit "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --notes-file release-assets/RELEASE_NOTES.md \
            "${release_state_flags[@]}"
          final_release_json="${RUNNER_TEMP}/market-sentinel-final-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${prepared_release_id}" > "${final_release_json}"
          if ! jq -e \
            --argjson release_id "${prepared_release_id}" \
            --arg tag "${TAG_NAME}" \
            --arg target "${GITHUB_SHA}" \
            --argjson expected_draft "${DRAFT}" \
            --argjson expected_prerelease "${PRERELEASE}" \
            '.id == $release_id and
             .tag_name == $tag and
             .target_commitish == $target and
             .draft == $expected_draft and
             .prerelease == $expected_prerelease' \
            "${final_release_json}" >/dev/null; then
            echo "Final release identity or state does not match the publish request." >&2
            exit 1
          fi
          release_fingerprint="$(
            jq -cS '{id,tag_name,target_commitish,draft,prerelease,name,body,published_at,updated_at}' \
              "${final_release_json}" | sha256sum | cut -d ' ' -f 1
          )"
          echo "release_id=${prepared_release_id}" >> "${GITHUB_OUTPUT}"
          echo "release_fingerprint=${release_fingerprint}" >> "${GITHUB_OUTPUT}"

      - name: Generate exact published release evidence
        if: needs.metadata.outputs.prerelease == 'false' && needs.metadata.outputs.draft == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          evidence_dir="${RUNNER_TEMP}/market-sentinel-release-evidence"
          mkdir -p "${evidence_dir}" release-evidence
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            > "${evidence_dir}/release.json"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' "${evidence_dir}/release.json")"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq 'flatten' > "${evidence_dir}/assets.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'flatten' > "${evidence_dir}/history.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > "${evidence_dir}/run.json"
          python scripts/generate_release_evidence.py \
            --asset-dir release-assets \
            --release-json "${evidence_dir}/release.json" \
            --assets-json "${evidence_dir}/assets.json" \
            --history-json "${evidence_dir}/history.json" \
            --run-json "${evidence_dir}/run.json" \
            --version "${RELEASE_VERSION}" \
            --tag "${TAG_NAME}" \
            --repository "${GITHUB_REPOSITORY}" \
            --revision "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-ref "${GITHUB_WORKFLOW_REF}" \
            --source-ref "${GITHUB_REF}" \
            --event "${GITHUB_EVENT_NAME}" \
            --output release-evidence/release-evidence.json

      - name: Attest exact published release evidence
        if: needs.metadata.outputs.prerelease == 'false' && needs.metadata.outputs.draft == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-evidence/release-evidence.json

      - name: Upload published release evidence
        if: needs.metadata.outputs.prerelease == 'false' && needs.metadata.outputs.draft == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/release-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Re-draft release after evidence failure
        if: ${{ always() && steps.publish_release.outputs.release_prepared == 'true' && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.metadata.outputs.tag_name }}
          RELEASE_ID: ${{ steps.publish_release.outputs.release_id }}
          RELEASE_FINGERPRINT: ${{ steps.publish_release.outputs.release_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]] || [[ ! "${RELEASE_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Release cleanup identity is missing or malformed; refusing mutation." >&2
            exit 1
          fi
          current_release_json="${RUNNER_TEMP}/market-sentinel-cleanup-current-release.json"
          redrafted_release_json="${RUNNER_TEMP}/market-sentinel-cleanup-redrafted-release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "${current_release_json}"
          current_fingerprint="$(
            jq -cS '{id,tag_name,target_commitish,draft,prerelease,name,body,published_at,updated_at}' \
              "${current_release_json}" | sha256sum | cut -d ' ' -f 1
          )"
          if [ "${current_fingerprint}" != "${RELEASE_FINGERPRINT}" ]; then
            echo "Release changed after publication; preserving the newer state instead of re-drafting it." >&2
            exit 1
          fi
          if ! jq -e \
            --argjson release_id "${RELEASE_ID}" \
            --arg tag "${TAG_NAME}" \
            --arg target "${GITHUB_SHA}" \
            '.id == $release_id and .tag_name == $tag and .target_commitish == $target and .draft == false' \
            "${current_release_json}" >/dev/null; then
            echo "Release cleanup preflight identity or state mismatch; refusing mutation." >&2
            exit 1
          fi
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=true > "${redrafted_release_json}"
          if ! jq -e \
            --argjson release_id "${RELEASE_ID}" \
            --arg tag "${TAG_NAME}" \
            --arg target "${GITHUB_SHA}" \
            '.id == $release_id and .tag_name == $tag and .target_commitish == $target and .draft == true' \
            "${redrafted_release_json}" >/dev/null; then
            echo "Release evidence failed and the exact release could not be returned to draft state." >&2
            exit 1
          fi
